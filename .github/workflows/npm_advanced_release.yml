name: NPM Advanced Packages Release

on:
  push:
    tags:
      - "advanced/v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - agent-policy
          - a2a-negotiation
          - intent-payments
          - smart-router
          - streaming-payments
          - zk-payments
      version:
        description: "Version to publish (leave empty to use package.json version)"
        required: false
        type: string
      tag:
        description: "NPM dist-tag"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
          - next
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: false
        type: boolean

env:
  WORKING_DIR: ./docs/internal/typescript

jobs:
  test:
    name: Test Advanced Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.WORKING_DIR }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: docs/internal/typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        working-directory: ${{ env.WORKING_DIR }}
        run: pnpm typecheck

      - name: Run tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          for pkg in agent-policy a2a-negotiation intent-payments smart-router streaming-payments zk-payments; do
            echo "Testing @t402/$pkg..."
            cd packages/$pkg
            pnpm test:run || pnpm test
            cd ../..
          done

  build:
    name: Build Advanced Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.WORKING_DIR }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: docs/internal/typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: ${{ env.WORKING_DIR }}
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: |
            ${{ env.WORKING_DIR }}/packages/*/dist
          retention-days: 1

  publish:
    name: Publish ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-policy
            path: packages/agent-policy
          - name: a2a-negotiation
            path: packages/a2a-negotiation
          - name: intent-payments
            path: packages/intent-payments
          - name: smart-router
            path: packages/smart-router
          - name: streaming-payments
            path: packages/streaming-payments
          - name: zk-payments
            path: packages/zk-payments
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.WORKING_DIR }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: docs/internal/typescript/pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: ${{ env.WORKING_DIR }}/packages

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Update version (if specified)
        if: ${{ github.event.inputs.version != '' }}
        working-directory: ${{ env.WORKING_DIR }}/${{ matrix.path }}
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./${{ env.WORKING_DIR }}/${{ matrix.path }}/package.json').version")
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.tag }}" != "" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Check if should publish
        id: should-publish
        run: |
          if [[ "${{ github.event.inputs.package }}" == "all" ]] || \
             [[ "${{ github.event.inputs.package }}" == "${{ matrix.name }}" ]] || \
             [[ "${{ github.event_name }}" == "push" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish @t402/${{ matrix.name }}
        if: steps.should-publish.outputs.publish == 'true'
        working-directory: ${{ env.WORKING_DIR }}/${{ matrix.path }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "DRY RUN: Would publish @t402/${{ matrix.name }} with tag ${{ steps.npm-tag.outputs.tag }}"
            npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }} --dry-run
          else
            npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }} || echo "Package may already exist at this version"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        if: steps.should-publish.outputs.publish == 'true'
        run: |
          VERSION=$(node -p "require('./${{ env.WORKING_DIR }}/${{ matrix.path }}/package.json').version")
          echo "### Published @t402/${{ matrix.name }}@${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ steps.npm-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- NPM: https://www.npmjs.com/package/@t402/${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Release Summary
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Generate release summary
        run: |
          echo "## T402 Advanced Packages Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| @t402/agent-policy | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @t402/a2a-negotiation | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @t402/intent-payments | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @t402/smart-router | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @t402/streaming-payments | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| @t402/zk-payments | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install @t402/agent-policy@${{ github.event.inputs.tag || 'beta' }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
