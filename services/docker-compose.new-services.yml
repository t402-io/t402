# T402 New Services — Docker Compose
# Deploy: docker compose -f docker-compose.new-services.yml up -d
#
# Prerequisites:
# - Docker + Docker Compose installed
# - Cloudflare Tunnel configured for new domains
# - Port 3402-3406 available

services:
  bazaar:
    build: ./bazaar
    container_name: t402-bazaar
    ports:
      - "3402:3402"
    environment:
      - PORT=3402
      - RATE_LIMIT_PER_MINUTE=60
      - BAZAAR_ADMIN_KEY=${BAZAAR_ADMIN_KEY:-}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3402/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  status:
    build: ./status
    container_name: t402-status
    ports:
      - "3403:3403"
    environment:
      - PORT=3403
      - NODE_ENV=production
      - WEBHOOK_URLS=${WEBHOOK_URLS:-}
      - MAINTENANCE_JSON=${MAINTENANCE_JSON:-[]}
    volumes:
      - status-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3403/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  explorer:
    build: ./explorer
    container_name: t402-explorer
    ports:
      - "3404:3404"
    environment:
      - PORT=3404
      - DATABASE_URL=${DATABASE_URL:-postgresql://facilitator:${POSTGRES_PASSWORD}@host.docker.internal:5432/facilitator}
      - EXPLORER_MODE=${EXPLORER_MODE:-auto}
      - SQLITE_PATH=/data/explorer.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - explorer-data:/data
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3404/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-dashboard:
    build: ./agent-dashboard
    container_name: t402-agent-dashboard
    ports:
      - "3405:3405"
    environment:
      - PORT=3405
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3405/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  sandbox:
    build: ./sandbox
    container_name: t402-sandbox
    ports:
      - "3406:3406"
    environment:
      - PORT=3406
      - FACILITATOR_URL=http://host.docker.internal:8080
      - RATE_LIMIT_PER_MINUTE=100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3406/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  status-data:
  explorer-data:
