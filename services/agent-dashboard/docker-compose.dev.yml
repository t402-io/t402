# Local development with PostgreSQL for live mode testing.
# Usage: docker compose -f docker-compose.dev.yml up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: facilitator
      POSTGRES_USER: facilitator
      POSTGRES_PASSWORD: dev-password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev-seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilitator"]
      interval: 5s
      timeout: 3s
      retries: 5

  dashboard:
    build: .
    ports:
      - "3405:3405"
    environment:
      - PORT=3405
      - DATABASE_URL=postgresql://facilitator:dev-password@postgres:5432/facilitator
      - RATE_LIMIT_PER_MINUTE=1000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
