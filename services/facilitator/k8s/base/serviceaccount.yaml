apiVersion: v1
kind: ServiceAccount
metadata:
  name: facilitator
  namespace: t402
  labels:
    app.kubernetes.io/name: facilitator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: facilitator
  namespace: t402
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: facilitator
  namespace: t402
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: facilitator
subjects:
  - kind: ServiceAccount
    name: facilitator
    namespace: t402
