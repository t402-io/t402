# Cloudflare Tunnel Configuration — New Services
#
# Add these entries to your existing ~/.cloudflared/config.yml
# on the production server.
#
# After adding, restart cloudflared:
#   sudo systemctl restart cloudflared
#
# Tunnel ID: Set CF_TUNNEL_ID in .env (do NOT hardcode here)

# --- ADD THESE TO YOUR EXISTING ingress SECTION ---

  # T402 Bazaar — Service Marketplace
  - hostname: bazaar.t402.io
    service: http://localhost:3402

  # T402 Status — Public Health Monitoring
  - hostname: status.t402.io
    service: http://localhost:3403

  # T402 Sandbox — Testnet Facilitator
  - hostname: sandbox.t402.io
    service: http://localhost:3406
