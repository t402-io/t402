# Cloudflare Workers configuration for demo.t402.io
# https://opennext.js.org/cloudflare

name = "t402-demo"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext worker entry point
main = ".open-next/worker.js"

# Assets configuration
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Keep workers.dev subdomain active for testing
workers_dev = true

# Custom domain
routes = [
  { pattern = "demo.t402.io/*", zone_id = "e1c1a85bc297aee0fc374451e12bc68d" }
]

# Environment variables
[vars]
NEXT_PUBLIC_FACILITATOR_URL = "https://facilitator.t402.io"
