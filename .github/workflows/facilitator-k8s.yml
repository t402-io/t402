name: Facilitator K8s Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'services/facilitator/k8s/**'
      - '.github/workflows/facilitator-k8s.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/facilitator/k8s/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  KUSTOMIZE_VERSION: '5.3.0'

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Validate Base
        run: |
          cd services/facilitator/k8s/base
          kustomize build . > /dev/null
          echo "Base manifests valid"

      - name: Validate Staging Overlay
        run: |
          cd services/facilitator/k8s/overlays/staging
          kustomize build . > /dev/null
          echo "Staging overlay valid"

      - name: Validate Production Overlay
        run: |
          cd services/facilitator/k8s/overlays/production
          kustomize build . > /dev/null
          echo "Production overlay valid"

      - name: Kubernetes Schema Validation
        uses: instrumenta/kubeval-action@master
        with:
          files: services/facilitator/k8s/base/*.yaml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Build Manifests
        run: |
          kustomize build services/facilitator/k8s/overlays/staging > staging.yaml
          kustomize build services/facilitator/k8s/overlays/production > production.yaml

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'services/facilitator/k8s'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Run Kubesec
        uses: controlplaneio/kubesec-action@v0.0.2
        with:
          input: staging.yaml

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging-facilitator.t402.io
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to Staging
        run: |
          kubectl apply -k services/facilitator/k8s/overlays/staging
          kubectl -n t402-staging rollout status deployment/staging-facilitator --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl -n t402-staging get pods
          kubectl -n t402-staging get svc

      - name: Health Check
        run: |
          # Wait for ingress to be ready
          sleep 30

          # Check health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging-facilitator.t402.io/health || echo "000")
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "Health check passed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://facilitator.t402.io
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to Production
        run: |
          kubectl apply -k services/facilitator/k8s/overlays/production
          kubectl -n t402 rollout status deployment/facilitator --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl -n t402 get pods
          kubectl -n t402 get svc
          kubectl -n t402 get hpa

      - name: Health Check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://facilitator.t402.io/health || echo "000")
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "Health check passed"

      - name: Notify Success
        if: success()
        run: |
          echo "## Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: production" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://facilitator.t402.io" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Failure
        if: failure()
        run: |
          echo "## Production Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Rolling back..." >> $GITHUB_STEP_SUMMARY
          kubectl -n t402 rollout undo deployment/facilitator
