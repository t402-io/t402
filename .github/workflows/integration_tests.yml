name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "sdks/typescript/packages/mechanisms/**"
      - "sdks/typescript/packages/core/**"
      - "sdks/go/mechanisms/**"
      - ".github/workflows/integration_tests.yml"
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"

env:
  # Testnet RPC URLs (public endpoints)
  ETH_SEPOLIA_RPC: "https://rpc.sepolia.org"
  ARB_SEPOLIA_RPC: "https://sepolia-rollup.arbitrum.io/rpc"
  BASE_SEPOLIA_RPC: "https://sepolia.base.org"
  SOLANA_DEVNET_RPC: "https://api.devnet.solana.com"
  TON_TESTNET_RPC: "https://testnet.toncenter.com/api/v2/jsonRPC"
  TRON_NILE_RPC: "https://nile.trongrid.io"

jobs:
  # TypeScript Integration Tests
  integration-typescript:
    name: TypeScript Integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mechanism: [evm, svm, ton, tron]
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ./sdks/typescript

      - name: Install dependencies
        working-directory: ./sdks/typescript
        run: pnpm install --frozen-lockfile

      - name: Build packages
        working-directory: ./sdks/typescript
        run: pnpm build

      - name: Run ${{ matrix.mechanism }} integration tests
        working-directory: ./sdks/typescript
        run: pnpm --filter @t402/${{ matrix.mechanism }} test:integration
        env:
          TEST_NETWORK: testnet
          CI: true

  # Go Integration Tests
  integration-go:
    name: Go Integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mechanism: [evm, svm, ton, tron]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: sdks/go/go.sum

      - name: Install dependencies
        working-directory: ./sdks/go
        run: go mod download

      - name: Run ${{ matrix.mechanism }} integration tests
        working-directory: ./sdks/go
        run: go test -v -tags=integration ./mechanisms/${{ matrix.mechanism }}/...
        env:
          TEST_NETWORK: testnet
          CI: true

  # Summary — fail the build on PR/push; warn-only on schedule/manual
  integration-summary:
    name: Integration Summary
    needs: [integration-typescript, integration-go]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "TypeScript Integration: ${{ needs.integration-typescript.result }}"
          echo "Go Integration: ${{ needs.integration-go.result }}"

          ts_result="${{ needs.integration-typescript.result }}"
          go_result="${{ needs.integration-go.result }}"
          has_failure=false

          if [ "$ts_result" == "failure" ] || [ "$go_result" == "failure" ]; then
            has_failure=true
          fi

          if [ "$has_failure" == "true" ]; then
            if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "::warning::Integration tests failed (non-blocking on scheduled/manual runs)."
            else
              echo "::error::Integration tests failed."
              exit 1
            fi
          fi
