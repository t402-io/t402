# T402 Facilitator Prometheus Alerting Rules
# Copy this file to your Prometheus rules directory

groups:
  - name: facilitator-availability
    interval: 30s
    rules:
      # Service availability
      - alert: FacilitatorDown
        expr: up{job="facilitator"} == 0
        for: 1m
        labels:
          severity: critical
          service: facilitator
        annotations:
          summary: "Facilitator service is down"
          description: "Facilitator instance {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://docs.t402.io/ops/runbooks/facilitator-down"

      - alert: FacilitatorHighRestartRate
        expr: changes(process_start_time_seconds{job="facilitator"}[1h]) > 3
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "Facilitator restarting frequently"
          description: "Facilitator instance {{ $labels.instance }} has restarted {{ $value }} times in the last hour."

  - name: facilitator-errors
    interval: 30s
    rules:
      # Error rate alerts
      - alert: FacilitatorHighErrorRate
        expr: |
          sum(rate(facilitator_errors_total[5m])) by (instance)
          / sum(rate(facilitator_requests_total[5m])) by (instance) > 0.05
        for: 5m
        labels:
          severity: critical
          service: facilitator
        annotations:
          summary: "High error rate detected"
          description: "Facilitator error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}."
          runbook_url: "https://docs.t402.io/ops/runbooks/high-error-rate"

      - alert: FacilitatorVerifyFailures
        expr: |
          sum(rate(facilitator_verify_total{result="failure"}[5m])) by (network)
          / sum(rate(facilitator_verify_total[5m])) by (network) > 0.1
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "High verify failure rate on {{ $labels.network }}"
          description: "Verify failure rate is {{ $value | humanizePercentage }} on network {{ $labels.network }}."

      - alert: FacilitatorSettleFailures
        expr: |
          sum(rate(facilitator_settle_total{result="failure"}[5m])) by (network)
          / sum(rate(facilitator_settle_total[5m])) by (network) > 0.1
        for: 5m
        labels:
          severity: critical
          service: facilitator
        annotations:
          summary: "High settle failure rate on {{ $labels.network }}"
          description: "Settle failure rate is {{ $value | humanizePercentage }} on network {{ $labels.network }}."
          runbook_url: "https://docs.t402.io/ops/runbooks/settle-failures"

  - name: facilitator-performance
    interval: 30s
    rules:
      # Latency alerts
      - alert: FacilitatorHighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(facilitator_request_duration_seconds_bucket[5m])) by (le, endpoint))
          > 2
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "High request latency on {{ $labels.endpoint }}"
          description: "95th percentile latency is {{ $value | humanizeDuration }} for endpoint {{ $labels.endpoint }}."

      - alert: FacilitatorSettlementSlow
        expr: |
          histogram_quantile(0.95, sum(rate(facilitator_settle_duration_seconds_bucket[5m])) by (le, network))
          > 120
        for: 10m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "Settlement taking too long on {{ $labels.network }}"
          description: "95th percentile settlement time is {{ $value | humanizeDuration }} on {{ $labels.network }}."

      - alert: FacilitatorSettlementVerySlow
        expr: |
          histogram_quantile(0.95, sum(rate(facilitator_settle_duration_seconds_bucket[5m])) by (le, network))
          > 300
        for: 5m
        labels:
          severity: critical
          service: facilitator
        annotations:
          summary: "Settlement critically slow on {{ $labels.network }}"
          description: "95th percentile settlement time exceeds 5 minutes on {{ $labels.network }}."
          runbook_url: "https://docs.t402.io/ops/runbooks/slow-settlement"

  - name: facilitator-resources
    interval: 30s
    rules:
      # Wallet balance alerts
      - alert: FacilitatorLowWalletBalance
        expr: facilitator_wallet_balance < 0.1
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "Low wallet balance on {{ $labels.network }}"
          description: "Wallet {{ $labels.address }} on {{ $labels.network }} has only {{ $value }} {{ $labels.asset }} remaining."

      - alert: FacilitatorCriticalWalletBalance
        expr: facilitator_wallet_balance < 0.01
        for: 1m
        labels:
          severity: critical
          service: facilitator
        annotations:
          summary: "Critical wallet balance on {{ $labels.network }}"
          description: "Wallet {{ $labels.address }} on {{ $labels.network }} is nearly empty ({{ $value }} {{ $labels.asset }})."
          runbook_url: "https://docs.t402.io/ops/runbooks/low-balance"

      # Rate limiting alerts
      - alert: FacilitatorHighRateLimiting
        expr: sum(rate(facilitator_rate_limit_exceeded_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "High rate of rate-limited requests"
          description: "{{ $value }} requests/sec are being rate limited."

  - name: facilitator-infrastructure
    interval: 30s
    rules:
      # RPC health alerts
      - alert: FacilitatorRPCUnhealthy
        expr: facilitator_rpc_healthy == 0
        for: 2m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "RPC endpoint unhealthy"
          description: "RPC endpoint {{ $labels.endpoint }} for {{ $labels.network }} is unhealthy."

      - alert: FacilitatorAllRPCsUnhealthy
        expr: |
          count(facilitator_rpc_healthy == 0) by (network)
          == count(facilitator_rpc_healthy) by (network)
        for: 1m
        labels:
          severity: critical
          service: facilitator
        annotations:
          summary: "All RPCs unhealthy for {{ $labels.network }}"
          description: "All RPC endpoints for network {{ $labels.network }} are unhealthy."
          runbook_url: "https://docs.t402.io/ops/runbooks/rpc-failure"

      # Database health alerts
      - alert: FacilitatorDBUnhealthy
        expr: facilitator_db_healthy == 0
        for: 1m
        labels:
          severity: critical
          service: facilitator
        annotations:
          summary: "Database is unhealthy"
          description: "Facilitator cannot connect to the database."
          runbook_url: "https://docs.t402.io/ops/runbooks/db-failure"

      # Stale data alerts
      - alert: FacilitatorStaleSync
        expr: time() - facilitator_last_successful_sync_timestamp > 600
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "Stale sync on {{ $labels.network }}"
          description: "No successful {{ $labels.operation }} on {{ $labels.network }} for over 10 minutes."

  - name: facilitator-capacity
    interval: 60s
    rules:
      # Traffic alerts
      - alert: FacilitatorHighTraffic
        expr: sum(rate(facilitator_requests_total[5m])) > 1000
        for: 5m
        labels:
          severity: info
          service: facilitator
        annotations:
          summary: "High traffic detected"
          description: "Facilitator is handling {{ $value }} requests/sec."

      - alert: FacilitatorVeryHighTraffic
        expr: sum(rate(facilitator_requests_total[5m])) > 5000
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "Very high traffic detected"
          description: "Facilitator is handling {{ $value }} requests/sec. Consider scaling."

      # Active requests
      - alert: FacilitatorHighActiveRequests
        expr: facilitator_active_requests > 100
        for: 5m
        labels:
          severity: warning
          service: facilitator
        annotations:
          summary: "High number of active requests"
          description: "{{ $value }} requests are currently being processed."
