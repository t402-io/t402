name: New Services CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/bazaar/**"
      - "services/status/**"
      - "services/explorer/**"
      - "services/agent-dashboard/**"
      - "services/sandbox/**"
  pull_request:
    paths:
      - "services/bazaar/**"
      - "services/status/**"
      - "services/explorer/**"
      - "services/agent-dashboard/**"
      - "services/sandbox/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - bazaar
          - status
          - explorer
          - agent-dashboard
          - sandbox
    name: test-${{ matrix.service }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start server
        if: matrix.service != 'status'
        run: npm start &
        env:
          BAZAAR_ADMIN_KEY: test-ci-key
          EXPLORER_MODE: seed
          RATE_LIMIT_PER_MINUTE: "1000"

      - name: Wait for server
        if: matrix.service != 'status'
        run: |
          PORT=${{ matrix.service == 'bazaar' && '3402' || matrix.service == 'explorer' && '3404' || matrix.service == 'agent-dashboard' && '3405' || '3406' }}
          for i in $(seq 1 15); do
            curl -sf http://localhost:${PORT}/health && break
            sleep 1
          done
          # Explorer needs extra time for seed data insertion
          if [ "${{ matrix.service }}" = "explorer" ]; then
            for i in $(seq 1 10); do
              COUNT=$(curl -sf http://localhost:${PORT}/api/v1/transactions?limit=1 | node -e "process.stdin.on('data',d=>{try{console.log(JSON.parse(d).total||0)}catch{console.log(0)}})" 2>/dev/null)
              [ "$COUNT" -gt 0 ] 2>/dev/null && break
              sleep 1
            done
          fi

      - name: Run tests
        run: npm test
        timeout-minutes: 5
        env:
          BAZAAR_ADMIN_KEY: test-ci-key
          RATE_LIMIT_PER_MINUTE: "1000"
          BASE_URL: http://localhost:${{ matrix.service == 'bazaar' && '3402' || matrix.service == 'status' && '3403' || matrix.service == 'explorer' && '3404' || matrix.service == 'agent-dashboard' && '3405' || '3406' }}

  detect-changes:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        run: |
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          CHANGED=""
          for svc in bazaar status explorer agent-dashboard sandbox; do
            if git diff --name-only "$BASE" "$HEAD" | grep -q "^services/${svc}/"; then
              CHANGED="${CHANGED:+$CHANGED }${svc}"
            fi
          done
          echo "services=${CHANGED:-none}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy changed services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/doge/github/t402-main
            git fetch origin main
            git checkout origin/main -- services/
            cd services
            set -- ${{ needs.detect-changes.outputs.services }}
            docker compose -f docker-compose.new-services.yml build "$@"
            docker compose -f docker-compose.new-services.yml up -d --no-deps "$@"
