name: NPM Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - core
          - extensions
          - evm-core
          - evm
          - svm
          - ton
          - tron
          - near
          - aptos
          - tezos
          - polkadot
          - stacks
          - cosmos
          - btc
          - stellar
          - erc8004
          - express
          - next
          - hono
          - fastify
          - fetch
          - axios
          - paywall
          - react
          - vue
          # WDK packages omitted — proprietary, published from private repo
          - a2a
          - mcp
          - cli
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip tests (use for re-publishing failed releases)"
        required: false
        default: false
        type: boolean

jobs:
  test:
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ./sdks/typescript

      - name: Install dependencies
        working-directory: ./sdks/typescript
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ./sdks/typescript
        run: pnpm test

  publish:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core packages
          - name: core
            path: packages/core
          - name: extensions
            path: packages/extensions
          # Mechanism packages
          - name: evm-core
            path: packages/mechanisms/evm-core
          - name: evm
            path: packages/mechanisms/evm
          - name: svm
            path: packages/mechanisms/svm
          - name: ton
            path: packages/mechanisms/ton
          - name: tron
            path: packages/mechanisms/tron
          - name: near
            path: packages/mechanisms/near
          - name: aptos
            path: packages/mechanisms/aptos
          - name: tezos
            path: packages/mechanisms/tezos
          - name: polkadot
            path: packages/mechanisms/polkadot
          - name: stacks
            path: packages/mechanisms/stacks
          - name: cosmos
            path: packages/mechanisms/cosmos
          - name: btc
            path: packages/mechanisms/btc
          - name: stellar
            path: packages/mechanisms/stellar
          # ERC-8004 package
          - name: erc8004
            path: packages/erc8004
          # HTTP server packages
          - name: express
            path: packages/http/express
          - name: next
            path: packages/http/next
          - name: hono
            path: packages/http/hono
          - name: fastify
            path: packages/http/fastify
          # HTTP client packages
          - name: fetch
            path: packages/http/fetch
          - name: axios
            path: packages/http/axios
          # UI packages
          - name: paywall
            path: packages/http/paywall
          - name: react
            path: packages/http/react
          - name: vue
            path: packages/http/vue
          # WDK packages omitted — proprietary, published from private repo
          # Transport packages
          - name: a2a
            path: packages/a2a
          # Tool packages
          - name: mcp
            path: packages/mcp
          - name: cli
            path: packages/cli
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ./sdks/typescript
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: ./sdks/typescript
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: ./sdks/typescript
        run: pnpm build

      - name: Publish @t402/${{ matrix.name }}
        if: ${{ github.event.inputs.package == 'all' || github.event.inputs.package == matrix.name || github.event_name == 'push' }}
        working-directory: ./sdks/typescript/${{ matrix.path }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Publishing ${PACKAGE_NAME}@${PACKAGE_VERSION}"

          # Check if this version already exists on npm
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "::warning::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists on npm, skipping"
            exit 0
          fi

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            pnpm publish --access public --no-git-checks --dry-run
          else
            pnpm publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
