apiVersion: v1
kind: Service
metadata:
  name: facilitator
  namespace: t402
  labels:
    app.kubernetes.io/name: facilitator
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: facilitator
---
apiVersion: v1
kind: Service
metadata:
  name: facilitator-headless
  namespace: t402
  labels:
    app.kubernetes.io/name: facilitator
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: facilitator
