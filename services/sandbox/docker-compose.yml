# Sandbox Facilitator - Testnet Only
# Deploy: docker compose up -d

services:
  facilitator:
    image: ghcr.io/t402-io/facilitator:latest
    ports:
      - "8080:8080"
    environment:
      - ENV=testnet
      - NETWORKS=eip155:84532,eip155:11155111,solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
      - EVM_PRIVATE_KEY=${EVM_PRIVATE_KEY}
      - RATE_LIMIT_PER_MINUTE=100
      - LOG_LEVEL=info
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
