name: Build Whitepaper

on:
  push:
    branches:
      - main
    paths:
      - "whitepaper/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-bibtex-extra biber

      - name: Compile Whitepaper
        working-directory: whitepaper
        run: make all

      - name: Copy PDF to site
        run: cp whitepaper/build/main.pdf services/site/public/t402-whitepaper.pdf

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/site/public/t402-whitepaper.pdf
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-update compiled whitepaper"
            git push
          fi
