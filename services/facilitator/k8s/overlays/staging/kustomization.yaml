apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: t402-staging

namePrefix: staging-

resources:
  - ../../base

patches:
  - path: patches/deployment.yaml
  - path: patches/configmap.yaml
  - path: patches/hpa.yaml
  - path: patches/ingress.yaml

images:
  - name: ghcr.io/t402-io/facilitator
    newTag: staging
