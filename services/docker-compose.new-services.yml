# T402 New Services — Docker Compose
# Deploy: docker compose -f docker-compose.new-services.yml up -d
#
# Prerequisites:
# - Docker + Docker Compose installed
name: t402-services
# - Cloudflare Tunnel configured for new domains
# - Port 3402-3406 available

services:
  bazaar:
    build: ./bazaar
    container_name: t402-bazaar
    ports:
      - "3402:3402"
    environment:
      - PORT=3402
      - RATE_LIMIT_PER_MINUTE=60
      - BAZAAR_ADMIN_KEY=${BAZAAR_ADMIN_KEY:-}
    volumes:
      - bazaar-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3402/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  status:
    build: ./status
    container_name: t402-status
    ports:
      - "3403:3403"
    environment:
      - PORT=3403
      - NODE_ENV=production
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - WEBHOOK_URLS=${WEBHOOK_URLS:-}
      - MAINTENANCE_JSON=${MAINTENANCE_JSON:-[]}
      - SERVICES_JSON=${SERVICES_JSON:-}
      - CHECK_INTERVAL_MS=${CHECK_INTERVAL_MS:-300000}
      - FAIL_THRESHOLD=${FAIL_THRESHOLD:-2}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - status-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3403/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  sandbox:
    build: ./sandbox
    container_name: t402-sandbox
    ports:
      - "3406:3406"
    environment:
      - PORT=3406
      - FACILITATOR_URL=${FACILITATOR_URL:-http://facilitator:8080}
      - RATE_LIMIT_PER_MINUTE=100
      - TRUST_CF_HEADER=true
      # FACILITATOR_API_KEY must be set in .env — required for /verify and /settle proxy calls to work
      - FACILITATOR_API_KEY=${FACILITATOR_API_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3406/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bazaar-data:
  status-data:

networks:
  scan2pay:
    name: scan2pay-java_scan2pay-network
    external: true
  facilitator:
    name: facilitator_internal
    external: true
  facilitator_ext:
    name: facilitator_external
    external: true
