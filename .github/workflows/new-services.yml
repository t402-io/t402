name: New Services CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "services/status/**"
      - "services/sandbox/**"
  pull_request:
    paths:
      - "services/status/**"
      - "services/sandbox/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - status
          - sandbox
    name: test-${{ matrix.service }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Start server
        if: matrix.service != 'status'
        run: npm start &
        env:
          RATE_LIMIT_PER_MINUTE: "1000"

      - name: Wait for server
        if: matrix.service != 'status'
        run: |
          PORT=3406
          for i in $(seq 1 15); do
            curl -sf http://localhost:${PORT}/health && break
            sleep 1
          done

      - name: Run tests
        run: npm test
        timeout-minutes: 5
        env:
          RATE_LIMIT_PER_MINUTE: "1000"
          BASE_URL: http://localhost:${{ matrix.service == 'status' && '3403' || '3406' }}

  detect-changes:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Deploy all services on manual trigger
            echo "services=status sandbox" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            CHANGED=""
            for svc in status sandbox; do
              if git diff --name-only "$BASE" "$HEAD" | grep -q "^services/${svc}/"; then
                CHANGED="${CHANGED:+$CHANGED }${svc}"
              fi
            done
            echo "services=${CHANGED:-none}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy changed services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/doge/github/t402-main
            git fetch origin main
            git checkout origin/main -- services/
            cd services
            set -- ${{ needs.detect-changes.outputs.services }}
            docker compose -f docker-compose.new-services.yml build "$@"
            docker compose -f docker-compose.new-services.yml up -d --no-deps "$@"
