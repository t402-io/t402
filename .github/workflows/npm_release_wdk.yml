name: NPM Release (WDK)

# Publishes the @t402/wdk* package family from the private premium submodule
# via npm Trusted Publishing (OIDC). No NPM_TOKEN needed.
#
# Architecture:
#   build-and-pack job (single)
#     - checkout w/ submodules (private premium via SUBMODULE_PAT)
#     - rsync all 8 wdk* from premium -> sdks/typescript/packages/wdk*/
#     - pnpm install + pnpm -r build (whole workspace, topological)
#     - pnpm -r --filter wdk* test
#     - npm pack each wdk* -> upload-artifact
#
#   publish jobs (matrix of 8, parallel)
#     - download-artifact (just the .tgz)
#     - npm publish ./<tarball>.tgz --provenance --access public  [OIDC]
#     - Gated by input.package selector
#
# Prerequisites (one-time):
# - Secret SUBMODULE_PAT (private premium submodule access)
# - Each wdk* package has its npm Trusted Publisher configured:
#     Repository owner: t402-io
#     Repository name:  t402
#     Workflow filename: npm_release_wdk.yml
#     Environment name: (blank)
#
# Trigger:
# - Push tag wdk/v* (e.g. wdk/v2.10.0)
# - Manual workflow_dispatch with package + dry_run

on:
  push:
    tags:
      - "wdk/v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - wdk
          - wdk-protocol
          - wdk-gasless
          - wdk-bridge
          - wdk-multisig
          - wdk-ton
          - wdk-ton-gasless
          - wdk-tron-gasfree
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip tests"
        required: false
        default: false
        type: boolean

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Sync premium -> mirror (all 8 wdk* packages)
        run: |
          for pkg in wdk wdk-gasless wdk-bridge wdk-multisig wdk-protocol wdk-ton wdk-ton-gasless wdk-tron-gasfree; do
            rsync -a \
              --exclude='node_modules' \
              --exclude='dist' \
              --exclude='.turbo' \
              "premium/packages/$pkg/" "sdks/typescript/packages/$pkg/"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: ./sdks/typescript

      - name: Install dependencies
        working-directory: ./sdks/typescript
        run: pnpm install

      - name: Build all workspace packages (topological)
        working-directory: ./sdks/typescript
        run: pnpm -r build

      - name: Test wdk* packages
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        working-directory: ./sdks/typescript
        run: |
          pnpm -r \
            --filter "@t402/wdk" \
            --filter "@t402/wdk-gasless" \
            --filter "@t402/wdk-bridge" \
            --filter "@t402/wdk-multisig" \
            --filter "@t402/wdk-protocol" \
            --filter "@t402/wdk-ton" \
            --filter "@t402/wdk-ton-gasless" \
            --filter "@t402/wdk-tron-gasfree" \
            test

      - name: Pack each wdk* into .tgz
        working-directory: ./sdks/typescript
        run: |
          mkdir -p /tmp/wdk-tarballs
          for pkg in wdk wdk-gasless wdk-bridge wdk-multisig wdk-protocol wdk-ton wdk-ton-gasless wdk-tron-gasfree; do
            (cd packages/$pkg && npm pack --pack-destination /tmp/wdk-tarballs)
          done
          ls -la /tmp/wdk-tarballs

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: wdk-tarballs
          path: /tmp/wdk-tarballs/*.tgz
          retention-days: 1

  publish:
    needs: build-and-pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Parallel — no inter-package dep at publish step (each is a self-contained tarball)
      matrix:
        name:
          - wdk-protocol
          - wdk-ton
          - wdk-gasless
          - wdk-bridge
          - wdk-multisig
          - wdk-ton-gasless
          - wdk-tron-gasfree
          - wdk
    steps:
      - name: Gate — should this package publish?
        id: gate
        run: |
          if [[ "${{ github.event.inputs.package }}" == "all" ]] \
             || [[ "${{ github.event.inputs.package }}" == "${{ matrix.name }}" ]] \
             || [[ "${{ github.event_name }}" == "push" ]]; then
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "Skipping @t402/${{ matrix.name }} (input.package=${{ github.event.inputs.package }})"
          fi

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download tarballs
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: wdk-tarballs
          path: /tmp/wdk-tarballs

      - name: Identify tarball
        if: steps.gate.outputs.publish == 'true'
        id: pkg
        run: |
          # The `[0-9]` anchor forces the version-number segment to follow the
          # package name, so sibling-named tarballs (e.g. wdk-ton vs
          # wdk-ton-gasless, or wdk vs wdk-bridge) do not get matched together.
          TARBALL=$(ls /tmp/wdk-tarballs/t402-${{ matrix.name }}-[0-9]*.tgz)
          if [[ $(echo "$TARBALL" | wc -l) -ne 1 ]]; then
            echo "ERROR: glob matched multiple files:"; echo "$TARBALL"; exit 1
          fi
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "Resolved: $TARBALL"

      - name: Publish @t402/${{ matrix.name }}
        if: steps.gate.outputs.publish == 'true'
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "DRY RUN: @t402/${{ matrix.name }}"
            npm publish "${{ steps.pkg.outputs.tarball }}" --access public --provenance --dry-run
          else
            npm publish "${{ steps.pkg.outputs.tarball }}" --access public --provenance
          fi

      - name: Summary
        if: steps.gate.outputs.publish == 'true'
        run: |
          VERSION=$(echo "${{ steps.pkg.outputs.tarball }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*' | head -1)
          {
            echo "### Published @t402/${{ matrix.name }}@${VERSION}"
            echo "- Provenance: enabled (OIDC)"
            echo "- NPM: https://www.npmjs.com/package/@t402/${{ matrix.name }}"
          } >> $GITHUB_STEP_SUMMARY
