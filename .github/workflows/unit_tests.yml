name: Unit Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # TypeScript Tests
  test-typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: ./sdks/typescript

      - name: Install dependencies
        working-directory: ./sdks/typescript
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: ./sdks/typescript
        run: pnpm test -- --coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20'
        uses: codecov/codecov-action@v6
        with:
          files: ./sdks/typescript/coverage/lcov.info
          flags: typescript
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Go Tests
  test-go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: sdks/go/go.sum

      - name: Install dependencies
        working-directory: ./sdks/go
        run: go mod download

      - name: Run tests with coverage
        working-directory: ./sdks/go
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.26'
        uses: codecov/codecov-action@v6
        with:
          files: ./sdks/go/coverage.out
          flags: go
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Python Tests
  test-python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdks/python/t402
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "sdks/python/t402/uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests with coverage
        run: uv run python -m pytest --cov=t402 --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./sdks/python/t402/coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Java Tests
  test-java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdks/java
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run tests with coverage
        run: mvn test jacoco:report -B

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./sdks/java/target/site/jacoco/jacoco.xml
          flags: java
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Solidity/Foundry Tests
  test-contracts:
    name: Solidity (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v6

      - name: Initialize dependencies
        run: |
          rm -rf lib/forge-std lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run tests
        run: forge test -vvv --no-match-path 'test/fork/*'

      - name: Run fork tests
        if: env.BASE_RPC_URL != ''
        run: forge test -vvv --match-path 'test/fork/*'
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

  # Summary job
  tests-passed:
    name: All Tests Passed
    needs: [test-typescript, test-go, test-python, test-java, test-contracts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-typescript.result }}" != "success" ] || \
             [ "${{ needs.test-go.result }}" != "success" ] || \
             [ "${{ needs.test-python.result }}" != "success" ] || \
             [ "${{ needs.test-java.result }}" != "success" ] || \
             [ "${{ needs.test-contracts.result }}" != "success" ]; then
            echo "Some tests failed"
            exit 1
          fi
          echo "All tests passed!"
