name: Contracts

on:
  pull_request:
    paths:
      - "contracts/**"
  push:
    branches:
      - main
    paths:
      - "contracts/**"

jobs:
  # Foundry Build & Test
  test-contracts:
    name: Foundry Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v7

      - name: Initialize dependencies
        run: |
          rm -rf lib/forge-std lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: forge build

      - name: Run tests
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: forge test -vvv

      - name: Run tests with gas report
        env:
          BASE_RPC_URL: https://mainnet.base.org
        run: forge test --gas-report

  # Solidity Linting
  lint-contracts:
    name: Solidity Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v7

      - name: Initialize dependencies
        run: |
          rm -rf lib/forge-std lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

  # Security Analysis
  security-contracts:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v7

      - name: Initialize dependencies
        run: |
          rm -rf lib/forge-std lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        continue-on-error: true
        with:
          target: contracts/
          slither-args: --filter-paths "lib/" --exclude-dependencies

  # Summary job
  contracts-passed:
    name: All Contract Checks Passed
    needs: [test-contracts, lint-contracts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.test-contracts.result }}" != "success" ] || \
             [ "${{ needs.lint-contracts.result }}" != "success" ]; then
            echo "Some contract checks failed"
            exit 1
          fi
          echo "All contract checks passed!"
