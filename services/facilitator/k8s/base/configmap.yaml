apiVersion: v1
kind: ConfigMap
metadata:
  name: facilitator-config
  namespace: t402
  labels:
    app.kubernetes.io/name: facilitator
data:
  PORT: "8080"
  ENVIRONMENT: "production"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "60"
  API_KEY_REQUIRED: "true"
  CORS_ALLOWED_ORIGINS: "https://t402.io,https://docs.t402.io"
