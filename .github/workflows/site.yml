name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - "services/site/**"
  workflow_dispatch:
  repository_dispatch:
    types: [sdk-updated, deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-bibtex-extra texlive-science biber

      - name: Compile Whitepaper
        working-directory: whitepaper
        run: make all

      - name: Copy PDF to site
        run: cp whitepaper/main.pdf services/site/public/t402-whitepaper.pdf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: services/site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/site
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: services/site
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name t402-site
          workingDirectory: services/site
