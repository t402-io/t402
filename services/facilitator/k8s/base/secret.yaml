apiVersion: v1
kind: Secret
metadata:
  name: facilitator-secrets
  namespace: t402
  labels:
    app.kubernetes.io/name: facilitator
type: Opaque
stringData:
  # EVM Configuration
  EVM_PRIVATE_KEY: "${EVM_PRIVATE_KEY}"
  ETH_RPC: "${ETH_RPC}"
  ARBITRUM_RPC: "${ARBITRUM_RPC}"
  BASE_RPC: "${BASE_RPC}"
  OPTIMISM_RPC: "${OPTIMISM_RPC}"
  INK_RPC: "${INK_RPC}"
  BERACHAIN_RPC: "${BERACHAIN_RPC}"
  UNICHAIN_RPC: "${UNICHAIN_RPC}"

  # Solana Configuration
  SVM_PRIVATE_KEY: "${SVM_PRIVATE_KEY}"
  SOLANA_RPC: "${SOLANA_RPC}"

  # TON Configuration
  TON_MNEMONIC: "${TON_MNEMONIC}"
  TON_RPC: "${TON_RPC}"
  TON_MAINNET_ADDRESS: "${TON_MAINNET_ADDRESS}"

  # TRON Configuration
  TRON_PRIVATE_KEY: "${TRON_PRIVATE_KEY}"
  TRON_RPC: "${TRON_RPC}"

  # Redis Configuration
  REDIS_URL: "${REDIS_URL}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # API Authentication
  API_KEYS: "${API_KEYS}"
